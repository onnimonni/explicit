name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Full build (Harper)
        run: |
          cargo clippy --all-targets --features harper -- -D warnings
          cargo test --features harper
      - name: Lint this repository with explicit
        run: cargo run --quiet -- check --no-remote --format github .

  nix:
    name: nix (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: aarch64-darwin
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: onnimonni
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # Pull requests only read from the cache.
          skipPush: ${{ github.event_name == 'pull_request' }}
      - run: nix build .#packages.${{ matrix.system }}.default --print-build-logs
      - run: ./result/bin/explicit --version
      - run: nix build .#packages.${{ matrix.system }}.explicit-full --print-build-logs --out-link result-full
      - run: ./result-full/bin/explicit --version
      - run: nix flake check --no-build
