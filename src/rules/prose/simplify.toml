  { match = ["on a regular basis"], replace = ["regularly"], fix = true },
  { match = ["on a weekly basis"], replace = ["weekly"], fix = true },
  { match = ["is able to"], replace = ["can"], fix = true },
  { match = ["are able to"], replace = ["can"], fix = true },
  { match = ["has the ability to", "have the ability to"], replace = ["can"] },
  { match = ["is required to", "are required to"], replace = ["must"] },
  { match = ["it is necessary that", "it is essential that"], replace = ["must"] },
  { match = ["as a means of", "as a means to"], replace = ["to"] },
