# explicit-disable-file slop/* prose/* grammar/* spelling -- rule data lists the phrases it flags
# prose/simplify: wordy or complex phrasing with a plain alternative, after retext-simplify
# and plainlanguage.gov. Schema: see lists.rs. `fix = true` only where the first
# replacement is grammatically safe in every context.
# Words already in the slop catalogue (utilize, facilitate, numerous, endeavor...) are left out.

entry = [
  # Wordy phrases with a safe one-to-one replacement.
  { match = ["in order to"], replace = ["to"], fix = true },
  { match = ["in order that"], replace = ["so that"], fix = true },
  { match = ["prior to"], replace = ["before"], fix = true },
  { match = ["due to the fact that", "owing to the fact that", "in light of the fact that", "on the grounds that", "for the reason that", "in view of the fact that"], replace = ["because"], fix = true },
  { match = ["despite the fact that", "in spite of the fact that", "regardless of the fact that"], replace = ["although"], fix = true },
  { match = ["at this point in time", "at the present time", "at this moment in time", "at the present moment"], replace = ["now"], fix = true },
  { match = ["at that point in time"], replace = ["then"], fix = true },
  { match = ["in the event that"], replace = ["if"], fix = true },
  { match = ["in the near future"], replace = ["soon"], fix = true },
  { match = ["during the course of", "in the course of"], replace = ["during"], fix = true },
  { match = ["each and every"], replace = ["each"], fix = true },
  { match = ["in close proximity to"], replace = ["near"], fix = true },
