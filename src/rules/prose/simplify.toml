  { match = ["in addition to"], replace = ["besides", "also"] },
  { match = ["in regard to", "in regards to", "with regard to", "with respect to", "in relation to", "in reference to"], replace = ["about", "for"] },
  { match = ["on behalf of"], replace = ["for"] },
  { match = ["make a decision"], replace = ["decide"] },
  { match = ["take into consideration", "take into account"], replace = ["consider"] },
