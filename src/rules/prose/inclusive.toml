# explicit-disable-file slop/* prose/* grammar/* spelling -- rule data lists the phrases it flags
# prose/inclusive: insensitive or exclusionary wording, after alex / retext-equality.
# Schema: see lists.rs. Matching is case-insensitive on whole words.

entry = [
