# explicit-disable-file slop/* prose/* grammar/* spelling -- rule data lists the phrases it flags
# prose/terminology: canonical spelling of product and technology names, after
# textlint-rule-terminology. `Canonical = [wrong forms]`; wrong forms match case-sensitively on
# whole words, and never inside paths, domains or identifiers (github.com, foo/Github).
# Lowercase forms are only listed where they are not also a command or package name.

