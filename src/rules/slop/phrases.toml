# explicit-disable-file slop/* prose/* grammar/* spelling -- rule data lists the phrases it flags
# Built-in slop catalogue.
#
# Schema of each [[phrase]] entry:
#   id             unique id; user catalogues (`[slop] extra`) replace entries by id,
#                  `[slop] disable` removes them
#   match          literal phrase or list of variants (ASCII case-insensitive, whole words;
#                  a straight apostrophe also matches a curly one)
#   pattern        regex instead of `match` (case-insensitive by default; `'` matches ' and ’;
#                  a named group `m` narrows the reported range)
#   category       boilerplate | filler | hype | hedge | metaphor | vocabulary | sycophancy | closer | opener
#   kind           "phrase" -> slop/phrase (always reported), "word" -> slop/word (info, feeds density)
#   severity       optional override of the rule default: "error" | "warning" | "info"
#   not_followed_by regex that must not match right after the hit (after the named group `nf`
#                  when the pattern has one); stands in for a negative lookahead
#   message        what is wrong
#   replace        simple replacements offered as suggestions
#   advice         rewrite advice when a replacement is not enough
#   example        text the entry must match (checked by a unit test)
#   counterexample text the entry must not match

# --- Sycophancy ---------------------------------------------------------------

[[phrase]]
id = "great-question"
match = ["great question", "good question", "excellent question", "what a great question", "fantastic question"]
category = "sycophancy"
kind = "phrase"
message = "praises the question instead of answering it"
advice = "Delete it and start with the answer."
example = "Great question! The cache is flushed on exit."
counterexample = "The question is when the cache is flushed."

[[phrase]]
id = "great-point"
match = ["great point", "excellent point", "that's a great point", "that's a fair point", "fantastic point"]
category = "sycophancy"
kind = "phrase"
message = "flatters the reader instead of engaging with the point"
advice = "Delete it and respond to the substance."
example = "That's a great point about retries."
counterexample = "The point about retries still stands."

[[phrase]]
id = "absolutely-right"
match = ["you're absolutely right", "you are absolutely right", "you're completely right", "you are completely right", "you're totally right", "you're right to point"]
category = "sycophancy"
kind = "phrase"
message = "sycophantic agreement"
advice = "Say what was wrong and what changes, without the flattery."
example = "You're absolutely right, the index is off by one."
counterexample = "The index is off by one."

[[phrase]]
id = "certainly-opener"
match = ["certainly!", "absolutely!", "of course!", "sure thing!", "great!", "perfect!"]
category = "sycophancy"
kind = "phrase"
message = "chatbot-style exclamation opener"
advice = "Delete it; start with the content."
example = "Certainly! Here is the updated config."
counterexample = "It certainly works for small inputs."

[[phrase]]
id = "happy-to-help"
match = ["i'd be happy to help", "i would be happy to help", "i'm happy to help", "happy to help!", "i'd be glad to help", "glad i could help"]
category = "sycophancy"
kind = "phrase"
message = "assistant boilerplate"
advice = "Delete it."
example = "I'd be happy to help with the migration."
counterexample = "The migration guide helps with upgrades."

[[phrase]]
id = "hope-this-helps"
match = ["i hope this helps", "hope this helps", "hope that helps", "i hope that helps", "hope you find this helpful", "hope you find this useful", "i hope you found this helpful"]
category = "closer"
kind = "phrase"
message = "assistant sign-off"
advice = "Delete it; end with the last useful sentence."
example = "Run the migration first. Hope this helps!"
counterexample = "Run the migration first; it helps with locking."

[[phrase]]
id = "let-me-know"
pattern = "\\blet me know if you (?:have any (?:other |further |more )?questions|need (?:anything|any) ?(?:else|more|further|help)|would like|'d like|want me to)"
category = "closer"
kind = "phrase"
message = "assistant sign-off"
advice = "Delete it, or point to a concrete support channel."
example = "Let me know if you have any questions."
counterexample = "Let me know the port number."

[[phrase]]
id = "dont-hesitate"
match = ["don't hesitate to", "do not hesitate to", "please don't hesitate"]
category = "closer"
kind = "phrase"
message = "customer-service boilerplate"
advice = "Say what to do directly: \"Open an issue if ...\"."
example = "Don't hesitate to open an issue."
counterexample = "Open an issue if the build fails."

[[phrase]]
id = "anything-else"
match = ["is there anything else i can help", "anything else you'd like me to", "anything else i can do for you"]
category = "closer"
kind = "phrase"
message = "assistant sign-off"
advice = "Delete it."
example = "Is there anything else I can help with?"
counterexample = "Nothing else depends on this flag."

[[phrase]]
id = "as-an-ai"
match = ["as an ai", "as an ai language model", "as a large language model", "as a language model"]
category = "boilerplate"
kind = "phrase"
message = "leaked assistant self-reference"
advice = "Delete it."
example = "As an AI, I cannot run the tests."
counterexample = "The AI module runs the tests."

[[phrase]]
id = "apologize-confusion"
match = ["i apologize for the confusion", "apologies for the confusion", "sorry for the confusion", "i apologize for any confusion", "i apologize for the oversight"]
category = "sycophancy"
kind = "phrase"
message = "assistant apology boilerplate"
advice = "Delete it and state the correction."
example = "I apologize for the confusion; the flag is --force."
counterexample = "The flag caused confusion; it is now --force."

[[phrase]]
id = "understand-frustration"
match = ["i understand your frustration", "i completely understand", "i totally understand your"]
category = "sycophancy"
kind = "phrase"
message = "scripted empathy"
advice = "Delete it and address the problem."
example = "I understand your frustration with the build times."
counterexample = "Build times are frustrating; caching cuts them in half."

# --- Openers ------------------------------------------------------------------

[[phrase]]
id = "heres-the-thing"
pattern = "\\bhere(?:'s| is) (?:the (?:thing|kicker|deal|twist|catch|rub)|(?:a|my|one) (?:twist|kicker|catch|rub))\\b|\\bthe kicker is\\b"
category = "opener"
kind = "phrase"
message = "throat-clearing setup"
advice = "Delete it and state the point."
example = "Here's the thing: the lock is never released."
counterexample = "The lock is never released."

[[phrase]]
id = "heres-a-breakdown"
pattern = "\\bhere(?:'s| is) (?:a|an) (?:quick |brief |detailed |comprehensive |concise |high-level )?(?:breakdown|overview|rundown|summary|look)\\b"
category = "opener"
kind = "phrase"
message = "chatbot preamble"
advice = "Delete it; a heading or the content itself does this job."
example = "Here's a quick breakdown of the options."
counterexample = "The options are listed below."

[[phrase]]
id = "what-you-need-to-know"
match = ["here's what you need to know", "here is what you need to know", "everything you need to know", "all you need to know"]
category = "opener"
kind = "phrase"
message = "clickbait opener"
advice = "Delete it and start with the facts."
example = "Here's what you need to know about tokens."
counterexample = "Tokens expire after an hour."

[[phrase]]
id = "lets-break-it-down"
match = ["let's break it down", "let's break this down", "let me break it down", "let me break this down", "let's unpack", "let's unpack this", "let me unpack"]
category = "opener"
kind = "phrase"
message = "chatbot transition"
advice = "Delete it; go straight to the parts."
example = "Let's break it down step by step."
counterexample = "The build breaks down into three steps."

[[phrase]]
id = "lets-dive-in"
match = ["let's dive in", "let's dive right in", "let's jump in", "let's jump right in", "let's get started", "let's get into it"]
category = "opener"
kind = "phrase"
message = "chatbot transition"
advice = "Delete it."
example = "Let's dive in!"
counterexample = "Start by installing the CLI."

[[phrase]]
id = "dive-into"
match = ["dive into", "dives into", "diving into", "dove into", "dive deep", "dive deeper", "diving deep", "dive deeply"]
category = "vocabulary"
kind = "phrase"
message = "stock AI verb"
replace = ["look at", "examine", "cover"]
example = "This guide will dive into the internals."
counterexample = "This guide covers the internals."

[[phrase]]
id = "deep-dive"
match = ["deep dive", "deep-dive", "deep dives", "deep-dives"]
category = "vocabulary"
kind = "phrase"
message = "stock AI noun"
replace = ["detailed look", "walkthrough", "analysis"]
example = "A deep dive into the scheduler."
counterexample = "A detailed look at the scheduler."

[[phrase]]
id = "lets-explore"
match = ["let's explore", "let us explore", "let's take a look", "let's take a closer look", "let's examine"]
category = "opener"
kind = "phrase"
message = "chatbot transition"
advice = "Delete it and present the material."
example = "Let's explore how the parser works."
counterexample = "The parser works in two passes."

[[phrase]]
id = "without-further-ado"
match = ["without further ado", "buckle up", "grab a coffee", "grab a cup of coffee"]
category = "opener"
kind = "phrase"
message = "filler opener"
advice = "Delete it."
example = "So, without further ado, the results."
counterexample = "The results follow."

[[phrase]]
id = "in-this-article"
pattern = "\\bin this (?:article|post|blog post|guide|tutorial|piece|section),? (?:we(?:'ll| will)|i(?:'ll| will)|you(?:'ll| will) (?:learn|discover))"
category = "opener"
kind = "phrase"
message = "formulaic article opener"
advice = "Delete it and start with the first real point."
example = "In this article, we'll explore caching."
counterexample = "This article covers caching."

[[phrase]]
id = "imagine-a-world"
match = ["imagine a world where", "imagine a world in which", "in a world where", "picture this"]
category = "opener"
kind = "phrase"
message = "cinematic opener"
advice = "Delete it and state the actual situation."
example = "Imagine a world where builds never fail."
counterexample = "Builds fail less often with pinned inputs."

[[phrase]]
id = "have-you-ever-wondered"
match = ["have you ever wondered", "ever wondered why", "ever wondered how"]
category = "opener"
kind = "phrase"
message = "rhetorical-question opener"
advice = "Delete it and give the answer."
example = "Have you ever wondered why DNS is slow?"
counterexample = "DNS is slow when the resolver times out."

[[phrase]]
id = "in-todays-world"
pattern = "\\bin today's (?:[\\w-]+ ){0,2}(?:world|age|era|landscape|environment|society|market)\\b"
category = "opener"
kind = "phrase"
message = "cliche scene-setting opener"
advice = "Delete it; the reader knows what year it is."
example = "In today's fast-paced world, speed matters."
counterexample = "Today's release fixes the crash."

[[phrase]]
id = "ever-evolving-landscape"
pattern = "\\bin the (?:ever-|constantly |rapidly |fast-)(?:evolving|changing|growing|moving) (?:world|landscape|field|realm|space|domain) of\\b"
category = "opener"
kind = "phrase"
message = "cliche scene-setting opener"
advice = "Delete it and start with the point."
example = "In the ever-evolving landscape of web development, tools change."
counterexample = "Web tooling changes every year."

[[phrase]]
id = "ever-evolving"
match = ["ever-evolving", "ever evolving", "ever-changing", "ever-growing", "ever-expanding", "constantly evolving"]
category = "hype"
kind = "phrase"
message = "cliche intensifier"
advice = "Delete it or say what actually changes and how often."
example = "An ever-evolving ecosystem of plugins."
counterexample = "A plugin ecosystem with monthly releases."

[[phrase]]
id = "digital-age"
match = ["in the digital age", "in the age of ai", "in this day and age", "in the modern era"]
category = "opener"
kind = "phrase"
message = "cliche scene-setting phrase"
advice = "Delete it."
example = "In the digital age, backups are vital."
counterexample = "Back up the database daily."

[[phrase]]
id = "whether-youre"
pattern = "\\bwhether you're (?:a |an )?(?:seasoned|beginner|novice|experienced|newcomer|veteran|just starting|new to)"
category = "opener"
kind = "phrase"
message = "formulaic audience framing"
advice = "Delete it, or say who the text is for in one plain sentence."
example = "Whether you're a seasoned developer or a beginner, this helps."
counterexample = "This guide assumes basic Git knowledge."

[[phrase]]
id = "this-is-where-comes-in"
pattern = "\\bthis is where (?:[\\w-]+ ){1,4}comes? in\\b"
category = "opener"
kind = "phrase"
message = "formulaic product introduction"
advice = "Name the tool and say what it does."
example = "This is where our caching layer comes in."
counterexample = "The caching layer stores parsed files."

[[phrase]]
id = "heres-why-it-matters"
pattern = "\\bhere's why (?:this|it|that) matters\\b|\\bwhy (?:this|it) matters:"
category = "opener"
kind = "phrase"
message = "formulaic importance framing"
advice = "State the consequence directly."
example = "Here's why this matters: users lose data."
counterexample = "Users lose data when the write fails."

# --- Closers ------------------------------------------------------------------

[[phrase]]
id = "in-conclusion"
match = ["in conclusion", "to conclude", "in closing"]
category = "closer"
kind = "phrase"
message = "essay-style closer"
advice = "Delete it; if a summary is needed, use a heading."
example = "In conclusion, the cache helps."
counterexample = "The conclusion is that the cache helps."

[[phrase]]
id = "in-summary"
match = ["in summary", "to summarize", "to sum up", "in sum", "summing up"]
category = "closer"
kind = "phrase"
message = "essay-style closer"
advice = "Delete it; repeat nothing the reader just read."
example = "In summary, use the new API."
counterexample = "The summary table lists every API."

[[phrase]]
id = "key-takeaway"
match = ["the key takeaway", "key takeaways", "the main takeaway", "the big takeaway", "the takeaway here"]
category = "closer"
kind = "phrase"
message = "formulaic recap"
advice = "Delete it and state the conclusion plainly."
example = "The key takeaway is to pin versions."
counterexample = "Pin versions to keep builds reproducible."

[[phrase]]
id = "at-the-end-of-the-day"
match = ["at the end of the day", "when all is said and done", "all in all", "all things considered"]
category = "closer"
kind = "phrase"
message = "cliche wrap-up"
advice = "Delete it."
example = "At the end of the day, tests matter."
counterexample = "The job runs at the end of each day's build."

[[phrase]]
id = "bottom-line"
match = ["the bottom line is", "bottom line:", "the bottom line:"]
category = "closer"
kind = "phrase"
message = "cliche wrap-up"
advice = "Delete it and state the conclusion."
example = "The bottom line is that it works."
counterexample = "The bottom row of the table is empty."

[[phrase]]
id = "happy-coding"
match = ["happy coding", "happy hacking", "happy building"]
category = "closer"
kind = "phrase"
message = "chatbot sign-off"
advice = "Delete it."
example = "That's it. Happy coding!"
counterexample = "That's it."

[[phrase]]
id = "by-following-these"
pattern = "\\bby following these (?:steps|best practices|tips|guidelines|simple steps)\\b"
category = "closer"
kind = "phrase"
message = "formulaic recap"
advice = "Delete it."
example = "By following these steps, you will succeed."
counterexample = "Follow these steps to install."

[[phrase]]
id = "stay-tuned"
match = ["stay tuned", "watch this space", "only time will tell", "the future is bright", "the possibilities are endless", "the sky's the limit"]
category = "closer"
kind = "phrase"
message = "cliche closer"
advice = "Delete it, or state the concrete plan."
example = "More features soon, stay tuned!"
counterexample = "Version 2 ships in March."

[[phrase]]
id = "final-thoughts"
match = ["final thoughts", "closing thoughts", "parting thoughts"]
category = "closer"
kind = "phrase"
message = "essay-style closer"
advice = "Delete the section or give it a descriptive name."
example = "Final thoughts: pin your versions."
counterexample = "Pin your versions."

[[phrase]]
id = "moving-forward"
match = ["moving forward", "going forward"]
category = "filler"
kind = "word"
message = "corporate filler"
replace = ["from now on", "later"]
advice = "Delete it; the future tense already says this."
example = "Moving forward, we will use Rust."
counterexample = "We will use Rust for new code."

[[phrase]]
id = "ship-it"
match = ["ship it", "ship it!", "let's ship it"]
category = "closer"
kind = "phrase"
message = "hype sign-off"
advice = "Delete it."
example = "Tests pass. Ship it!"
counterexample = "We ship its binaries on GitHub."

[[phrase]]
id = "every-step-of-the-way"
match = ["every step of the way", "on every step of your journey"]
category = "closer"
kind = "phrase"
message = "marketing cliche"
advice = "Delete it."
example = "We support you every step of the way."
counterexample = "Each step logs its duration."

# --- Boilerplate and filler --------------------------------------------------

[[phrase]]
id = "worth-noting"
match = ["it's worth noting", "it is worth noting", "worth noting that", "it's worth mentioning", "it is worth mentioning", "it bears mentioning", "it should be noted"]
category = "filler"
kind = "phrase"
message = "throat-clearing filler"
advice = "Delete it and state the fact."
example = "It's worth noting that the API is async."
counterexample = "Note that the API is async."

[[phrase]]
id = "important-to-note"
pattern = "\\bit(?:'s|\\s+is|\\s+was)\\s+(?:also\\s+)?(?:(?:important|crucial|essential|vital|key|critical|worth)\\s+(?:to\\s+(?:note|remember|understand|recognize|keep\\s+in\\s+mind|mention|highlight|emphasize|consider|pause|ask))|worth\\s+(?:remembering|pausing|considering|asking))\\b"
category = "filler"
kind = "phrase"
message = "throat-clearing filler"
advice = "Delete it; if it is important, the sentence alone shows that."
example = "It is important to note that keys are case-sensitive."
counterexample = "Keys are case-sensitive; this is important for lookups."

[[phrase]]
id = "needless-to-say"
match = ["needless to say", "it goes without saying", "it should go without saying"]
category = "filler"
kind = "phrase"
message = "filler that contradicts itself"
advice = "Delete it; if it needs no saying, don't say it."
example = "Needless to say, back up first."
counterexample = "Back up first."

[[phrase]]
id = "that-being-said"
match = ["that being said", "with that being said", "with that said", "having said that", "that said,"]
category = "filler"
kind = "phrase"
message = "transitional filler"
replace = ["but", "still", "however"]
example = "That being said, it is slow."
counterexample = "It is slow, but correct."

[[phrase]]
id = "when-it-comes-to"
match = ["when it comes to", "when it comes down to"]
category = "filler"
kind = "phrase"
message = "wordy filler"
replace = ["for", "with", "in"]
example = "When it comes to speed, Rust wins."
counterexample = "For speed, Rust wins."

[[phrase]]
id = "in-the-realm-of"
match = ["in the realm of", "in the world of", "in the sphere of", "in the domain of"]
category = "filler"
kind = "phrase"
message = "inflated filler"
replace = ["in"]
example = "In the realm of databases, indexes matter."
counterexample = "Indexes matter in databases."

[[phrase]]
id = "realm"
pattern = "\\b(?:the )?realms? of\\b"
category = "vocabulary"
kind = "word"
message = "inflated word"
replace = ["field of", "area of"]
example = "It opens the realm of possibilities."
counterexample = "Create a Keycloak realm for tests."

[[phrase]]
id = "in-terms-of"
match = ["in terms of"]
category = "filler"
kind = "word"
message = "vague connector"
advice = "Name the relationship: \"for\", \"by\", \"measured in\"."
example = "In terms of speed, it is fine."
counterexample = "Measured in requests per second, it is fine."

[[phrase]]
id = "wide-array"
match = ["a wide array of", "a vast array of", "a diverse array of", "a broad array of", "a diverse range of"]
category = "filler"
kind = "phrase"
message = "inflated quantifier"
replace = ["many"]
advice = "Give the number or name the items."
example = "Supports a wide array of formats."
counterexample = "Supports JSON, YAML and TOML."

[[phrase]]
id = "wide-range"
match = ["a wide range of", "a wide variety of", "a broad range of"]
category = "filler"
kind = "word"
message = "vague quantifier"
replace = ["many"]
advice = "Give the number or name the items."
example = "It handles a wide range of inputs."
counterexample = "It handles UTF-8 and UTF-16 inputs."

[[phrase]]
id = "plethora"
match = ["a plethora of", "plethora", "a myriad of", "a multitude of"]
category = "vocabulary"
kind = "phrase"
message = "inflated quantifier"
replace = ["many", "lots of"]
example = "There is a plethora of options."
counterexample = "There are many options."

[[phrase]]
id = "myriad"
match = ["myriad"]
category = "vocabulary"
kind = "word"
message = "inflated quantifier"
replace = ["many", "countless"]
example = "Myriad plugins exist."
counterexample = "Many plugins exist."

[[phrase]]
id = "plays-a-role"
pattern = "\\bplay(?:s|ed|ing)?\\s+(?:a|an)\\s+(?:\\w+\\s+)?(?:crucial|pivotal|vital|key|critical|significant|essential|important|central|major|instrumental)\\s+role\\b"
category = "filler"
kind = "phrase"
message = "vague importance claim"
advice = "Say what it actually does."
example = "The cache plays a crucial role in latency."
counterexample = "The cache cuts latency by 40%."

[[phrase]]
id = "serves-as"
match = ["serves as a", "serve as a", "serving as a", "serves as an", "serves as the"]
category = "filler"
kind = "word"
message = "wordy verb"
replace = ["is"]
example = "This module serves as a bridge."
counterexample = "This module is a bridge."

[[phrase]]
id = "stands-as"
match = ["stands as a", "stands as an", "stands as the", "stand as a"]
category = "hype"
kind = "phrase"
message = "inflated verb"
replace = ["is"]
example = "It stands as a model of clarity."
counterexample = "It stands alone as a binary."

[[phrase]]
id = "testament"
match = ["a testament to", "testament to", "is a testament", "stands as a testament"]
category = "hype"
kind = "phrase"
message = "cliche praise"
advice = "Say what the evidence shows."
example = "This is a testament to the team's work."
counterexample = "The team shipped it in two weeks."

[[phrase]]
id = "underscore"
pattern = "\\bunderscor(?:es|ing|ed) (?:the|how|that|its|our|their|a|an|this|why|just)\\b|\\bunderscore (?:the|how|that|why) (?:importance|need|significance|fact|value)\\b"
category = "vocabulary"
kind = "phrase"
message = "stock AI verb"
replace = ["shows", "stresses"]
example = "This underscores the importance of tests."
counterexample = "Private fields start with an underscore."

[[phrase]]
id = "importance-of"
pattern = "\\b(?:highlights?|highlighting|emphasizes?|emphasizing|stresses|reinforces?) the (?:importance|significance|need|value) of\\b"
category = "filler"
kind = "phrase"
message = "vague importance claim"
advice = "State the consequence instead of calling it important."
example = "This highlights the importance of backups."
counterexample = "Without backups the data is gone."

[[phrase]]
id = "navigate-complexities"
pattern = "\\bnavigat(?:e|es|ing|ed) (?:the )?(?:complexities|intricacies|challenges|nuances|landscape|waters|maze|world)\\b"
category = "metaphor"
kind = "phrase"
message = "stock AI metaphor"
replace = ["handle", "deal with"]
example = "Navigate the complexities of Kubernetes."
counterexample = "Navigate to the settings page."

[[phrase]]
id = "embark-journey"
pattern = "\\bembark(?:s|ed|ing)? (?:on|upon) (?:a|an|this|our|your|the) (?:[\\w-]+ )?(?:journey|quest|adventure|mission|path)\\b"
category = "metaphor"
kind = "phrase"
message = "stock AI metaphor"
replace = ["start", "begin"]
example = "Embark on a journey through Rust."
counterexample = "Start learning Rust."

[[phrase]]
id = "harness-power"
pattern = "\\bharness(?:es|ing|ed)? the (?:full |true )?(?:power|potential|capabilities|strength) of\\b"
category = "hype"
kind = "phrase"
message = "marketing cliche"
replace = ["use"]
example = "Harness the power of async I/O."
counterexample = "Use async I/O."

[[phrase]]
id = "unlock-potential"
pattern = "\\bunlock(?:s|ing|ed)? (?:the |your |its )?(?:full |true |new )?(?:potential|power|value|possibilities|opportunities|secrets|capabilities)\\b"
category = "hype"
kind = "phrase"
message = "marketing cliche"
advice = "Say what the reader can do that they could not before."
example = "Unlock the full potential of your data."
counterexample = "Unlock the mutex before returning."

