kind = "word"
message = "filler adverb"
advice = "Delete it."
example = "It is basically a queue."
counterexample = "It is a queue."

[[phrase]]
id = "actionable-insights"
pattern = "\\b(?:actionable|valuable|deep|key|meaningful) insights?\\b"
category = "hype"
kind = "phrase"
message = "consultant cliche"
advice = "Say what the reader learns."
example = "Get actionable insights from logs."
counterexample = "Find slow queries in the logs."

[[phrase]]
id = "think-of-it-as"
match = ["think of it as", "think of it like"]
category = "filler"
kind = "word"
message = "analogy setup"
advice = "Consider stating the thing directly."
example = "Think of it as a cache."
counterexample = "It is a cache."

[[phrase]]
id = "plot-twist"
match = ["plot twist", "spoiler alert", "let that sink in", "read that again", "and that's okay", "and that's ok", "and that's fine"]
category = "filler"
kind = "phrase"
message = "social-media mannerism"
advice = "Delete it."
example = "Plot twist: the bug was in the test."
counterexample = "The bug was in the test."

[[phrase]]
id = "harsh-truth"
pattern = "\\bthe (?:harsh|hard|uncomfortable|brutal|simple|honest) truth\\b"
category = "filler"
kind = "phrase"
message = "dramatic framing"
advice = "State the fact."
example = "The harsh truth is that nobody reads docs."
counterexample = "Few users read the docs."

[[phrase]]
id = "more-than-just"
match = ["more than just a", "more than just an", "so much more than"]
category = "hype"
kind = "phrase"
message = "hype framing"
advice = "Say what it is."
example = "It's more than just a linter."
counterexample = "It is a linter and formatter."

[[phrase]]
id = "new-era"
match = ["a new era", "ushering in", "usher in", "ushers in"]
category = "hype"
kind = "phrase"
message = "grandiose framing"
advice = "Say what changes."
example = "This ushers in a new era of builds."
counterexample = "Builds are now incremental."

[[phrase]]
id = "never-been"
pattern = "\\bha(?:s|ve) never been (?:more important|higher|easier|more critical|more relevant|more urgent)\\b"
category = "hype"
kind = "phrase"
message = "grandiose framing"
advice = "State the actual reason for urgency."
example = "Security has never been more important."
counterexample = "Security has never been audited."

[[phrase]]
id = "future-proof"
match = ["future-proof", "future proof", "mission-critical", "hassle-free", "frictionless"]
category = "hype"
kind = "word"
message = "marketing adjective"
advice = "Say what concretely makes it so."
example = "A future-proof design."
counterexample = "A design with versioned APIs."

[[phrase]]
id = "under-the-hood"
match = ["under the hood", "behind the scenes"]
category = "metaphor"
kind = "word"
message = "cliche metaphor"
replace = ["internally"]
example = "Under the hood, it uses SQLite."
counterexample = "Internally, it uses SQLite."

[[phrase]]
id = "shed-light"
pattern = "\\bshed(?:s|ding)? (?:some |new )?light on\\b|\\bpav(?:e|es|ed|ing) the way\\b"
category = "metaphor"
kind = "phrase"
message = "cliche metaphor"
replace = ["explain", "enable"]
example = "This sheds light on the bug."
counterexample = "This explains the bug."

[[phrase]]
id = "ahead-of-the-curve"
match = ["ahead of the curve", "move the needle", "moves the needle", "moving the needle", "circle back"]
category = "metaphor"
kind = "phrase"
message = "corporate cliche"
advice = "Say it literally."
example = "This keeps you ahead of the curve."
counterexample = "This supports the latest spec."

[[phrase]]
id = "where-the-magic-happens"
match = ["where the magic happens", "the magic happens", "is a breeze", "a breeze to", "works like a charm"]
category = "metaphor"
kind = "phrase"
message = "cliche"
advice = "Say what happens or how easy it is."
example = "This is where the magic happens."
counterexample = "This function renders the page."

[[phrase]]
id = "grand-scheme"
match = ["in the grand scheme of things", "tip of the iceberg", "a perfect storm", "the perfect storm"]
category = "metaphor"
kind = "phrase"
message = "cliche metaphor"
advice = "Say it literally."
example = "This is just the tip of the iceberg."
counterexample = "This is one of many issues."

[[phrase]]
id = "silver-bullet"
match = ["silver bullet", "gold standard", "force multiplier", "table stakes", "battle-tested", "rock-solid", "rock solid"]
category = "metaphor"
kind = "word"
message = "stock metaphor"
advice = "Say it literally."
example = "Tests are a force multiplier."
counterexample = "Tests catch regressions early."

[[phrase]]
id = "rabbit-hole"
match = ["rabbit hole", "down the rabbit hole", "can of worms"]
category = "metaphor"
kind = "word"
message = "stock metaphor"
advice = "Say it literally."
example = "Don't go down the rabbit hole."
counterexample = "Don't spend time on this."

[[phrase]]
id = "its-that-simple"
match = ["it's that simple", "it's as simple as that", "it's that easy", "voila", "voilà", "and voila", "just like that"]
category = "closer"
kind = "phrase"
message = "chatbot flourish"
advice = "Delete it."
example = "Run one command. It's that simple!"
counterexample = "Run one command."

[[phrase]]
id = "the-reality-is"
match = ["the reality is", "the truth is", "the fact of the matter is", "the fact is"]
category = "filler"
kind = "word"
message = "throat-clearing setup"
advice = "Delete it and state the fact."
example = "The reality is that nobody reads logs."
counterexample = "Nobody reads logs."

[[phrase]]
id = "feel-free"
match = ["feel free to"]
category = "boilerplate"
kind = "word"
message = "assistant boilerplate"
advice = "Use a plain imperative: \"Open an issue if ...\"."
example = "Feel free to open an issue."
counterexample = "Open an issue for bugs."

[[phrase]]
id = "simply-put"
match = ["simply put", "put simply", "in simple terms", "in layman's terms"]
category = "filler"
kind = "phrase"
message = "filler framing"
advice = "Delete it; just say it simply."
example = "Simply put, it caches results."
counterexample = "It caches results."

[[phrase]]
id = "significantly"
match = ["significantly", "substantially", "dramatically", "vastly"]
category = "filler"
kind = "word"
message = "unquantified intensifier"
advice = "Give a number."
example = "It is significantly faster."
counterexample = "It is 3x faster."

[[phrase]]
id = "various"
match = ["various", "a variety of", "numerous"]
category = "filler"
kind = "word"
message = "vague quantifier"
advice = "Name them or give a count."
example = "It supports various formats."
counterexample = "It supports JSON and YAML."

[[phrase]]
id = "ensure"
pattern = "\\b(?:ensures?|ensuring) (?:that )?(?:a |the )?(?:seamless|smooth|robust|optimal|consistent|reliable|high-quality)\\b"
category = "hype"
kind = "phrase"
message = "promise without content"
advice = "Say what check or mechanism provides it."
example = "This ensures a seamless experience."
counterexample = "This ensures the file is closed."

[[phrase]]
id = "smooth-experience"
pattern = "\\b(?:seamless|smooth|frictionless|delightful|intuitive|enhanced|optimal) (?:user |developer )?experience\\b"
category = "hype"
kind = "phrase"
message = "marketing cliche"
advice = "Say what the user does and what no longer gets in the way."
example = "Enjoy a delightful developer experience."
counterexample = "Errors point to the exact line."

[[phrase]]
id = "key-features"
pattern = "(?m)^\\s*(?P<m>(?:key|core|main) (?:features|benefits|highlights)):?\\s*$"
category = "boilerplate"
kind = "word"
message = "generic heading"
advice = "Name what the list is about, or drop the heading."
example = "Key Features:"
counterexample = "Key features of the parser are listed in the table."

[[phrase]]
id = "why-choose"
pattern = "\\bwhy choose (?:[\\w-]+\\s?){1,3}\\?|\\bwhy you should (?:use|choose|care)\\b"
category = "boilerplate"
kind = "phrase"
message = "marketing heading"
advice = "Compare concretely with the alternatives."
example = "Why you should use explicit"
counterexample = "Use explicit to lint prose."

[[phrase]]
id = "a-must"
match = ["a must-have", "must-have", "a must-read", "must-read", "a no-brainer", "no-brainer"]
category = "hype"
kind = "phrase"
message = "hype cliche"
advice = "Say why."
example = "This plugin is a must-have."
counterexample = "This plugin formats on save."

[[phrase]]
id = "fast-paced"
match = ["dynamic and ever-changing", "fast-paced", "rapidly evolving", "rapidly changing"]
category = "hype"
kind = "word"
message = "cliche scene-setting"
advice = "Delete it."
example = "A fast-paced industry."
counterexample = "An industry with monthly releases."

[[phrase]]
id = "crucial-step"
pattern = "\\b(?:a|an|the) (?:crucial|critical|vital|essential|pivotal|key|important|significant) (?:step|aspect|component|element|part|factor) (?:in|of|for|towards?)\\b"
category = "filler"
kind = "word"
message = "vague importance claim"
advice = "Say what depends on it."
example = "Validation is a crucial step in the pipeline."
counterexample = "Validation runs before the build."

[[phrase]]
id = "whole-new"
match = ["a whole new level", "a whole new world", "whole new level", "opens up a world of"]
category = "hype"
kind = "phrase"
message = "hype cliche"
advice = "Say what is new."
example = "It opens up a world of options."
counterexample = "It adds two options."

[[phrase]]
id = "vital"
match = ["vital", "vitally"]
category = "vocabulary"
kind = "word"
message = "overused intensifier"
replace = ["important", "required"]
example = "Logging is vital."
counterexample = "Logging is required."

# --- LLM cliche highlighter ---------------------------------------------------
#
# Entries below (and the broadened `heres-the-thing`, `important-to-note`,
# `plays-a-role` and `landscape` patterns above) are adapted from Simon Willison's
# llm-cliche-highlighter (Apache-2.0, https://github.com/simonw/tools, commit
# a48d9920ff1cf203cd0070c3e8321283df50bf11). The Wikipedia-group ideas come from
# https://en.wikipedia.org/wiki/Wikipedia:Signs_of_AI_writing (CC BY-SA 4.0). See NOTICE.
# Positive and negative cases from the upstream self-tests live in `cliche.rs`.

[[phrase]]
id = "chatbot-leftovers"
pattern = '''\bas\s+of\s+my\s+last\s+(?:update|training|knowledge\s+update)\b|\bmy\s+(?:knowledge|training)(?:\s+data)?\s+cut-?off\b|\bI\s+(?:cannot|can't|do\s+not|don't)\s+(?:browse\s+the\s+internet|access\s+real-?time)\b|\bcontentReference\[|\boaicite(?::\d+)?|\bturn0(?:search|news|image)\d*|\battributableIndex\b|utm_source=(?:chatgpt|openai|copilot|perplexity|claude|gemini)'''
category = "boilerplate"
kind = "phrase"
severity = "error"
message = "text pasted straight from a chatbot"
advice = "Delete the chatbot residue and check the surrounding text is still accurate."
example = "As of my last update, the API was in beta."
counterexample = "The last update shipped on Tuesday."

[[phrase]]
id = "sit-with-that"
pattern = '''\bsit(?:s|ting)?\s+with\s+(?:that|this|it|(?:the|your)\s+(?:discomfort|feelings?|tension|weight|uncertainty|ambiguity|grief|silence|unease))\b(?:\s+for\s+a\s+\w+)?'''
category = "filler"
kind = "phrase"
message = "therapist-voice reflection prompt"
advice = "Delete it; if the point needs weight, give the reason it matters."
example = "Sit with that for a moment."
counterexample = "Come sit with us at lunch."

[[phrase]]
id = "you-already-know"
pattern = '''\byou\s+already\s+knows?\s+the\s+answer\b|(?P<m>\byou\s+already\s+knows?)[ \t]*(?:[^\w\s]|\n|$)'''
category = "filler"
kind = "phrase"
message = "knowing-wink appeal to the reader"
advice = "State the answer instead of implying the reader has it."
example = "Deep down, you already know."
counterexample = "If you already know Python, skip ahead."

[[phrase]]
id = "you-already-know-what"
pattern = '''\byou\s+already\s+knows?\s+(?:what|how|why|this|that|it|who|where)\b'''
category = "filler"
kind = "word"
message = "appeal to what the reader supposedly knows"
advice = "Say the thing, or link to where it is explained."
example = "You already know what to do."
counterexample = "You already have the key."

[[phrase]]
id = "the-punchline"
pattern = '''\bthe\s+punchline(?:\s+(?:is|was|being)\b|\s*[:?])'''
category = "filler"
kind = "phrase"
message = "stage-managed reveal"
advice = "Delete the setup and state the result."
example = "The punchline: nothing changed."
counterexample = "He forgot the punchline entirely."

[[phrase]]
id = "worth-naming"
pattern = '''(?:\b(?:is|are|was|were|feels?|felt|seems?|seemed)|'s)\s+(?:\w+\s+){0,2}?worth\s+naming\b|\bworth\s+naming\s*:'''
not_followed_by = '''\s+names\b'''
category = "filler"
kind = "phrase"
message = "therapist-voice framing"
advice = "Name the thing directly instead of announcing that it deserves naming."
example = "The grief here is worth naming."
counterexample = "It's not worth naming names here."

[[phrase]]
id = "not-nothing"
pattern = '''\b(?:that|this|it|which)(?:'s|\s+(?:is|was))\s+not\s+nothing\b'''
category = "filler"
kind = "phrase"
message = "coy double negative"
advice = "Say what the result is worth, ideally with a number."
example = "Ten sign-ups in a week, and that's not nothing."
counterexample = "There is nothing left to say."

[[phrase]]
id = "is-the-whole"
pattern = '''(?:\b(?:is|was|are|were)|'s)\s+the\s+(?:whole|entire)\s+(?:point|game|trick|pitch|idea|story|thing|secret|problem|lesson|appeal|magic|reason|business|job|value|difference|benefit|goal|plan)\b|\bhere(?:'s|\s+is)\s+the\s+whole\s+\w+'''
category = "filler"
kind = "word"
message = "rhetorical emphasis"
advice = "State the point itself; \"the whole point\" adds drama, not information."
example = "Consistency is the entire game."
counterexample = "He toured the entire factory."

[[phrase]]
id = "the-entire-is"
pattern = '''\bthe\s+entire\s+(?:point|game|trick|pitch|idea|story|thing|secret|problem|lesson|appeal|magic|reason|business|job|value|difference|benefit|goal|plan|team|history|industry|world|premise|argument)(?:\s+[\w-]+){0,4}?\s+(?:is|was|are|were)\b'''
category = "filler"
kind = "word"
message = "rhetorical emphasis"
advice = "Drop \"the entire\" and state the claim."
example = "The entire point is that nobody reads."
counterexample = "He ate the entire pizza."

[[phrase]]
id = "is-real"
pattern = '''\bis\s+real\b(?P<nf>)[^.!?\n]*?\b(?:and|not)\b'''
not_followed_by = '''[\s-]+(?:estate|time|life|world|quick|numbers?|users?|hardware|devices?|data|money)\b'''
category = "filler"
kind = "word"
message = "\"X is real, and ...\" validation formula"
advice = "Quantify the effect instead of vouching for its existence."
example = "The improvement is real, and it's not subtle."
counterexample = "The painting is real, but stolen."

[[phrase]]
id = "is-the-real"
pattern = '''\bis\s+(?:the|a)\s+real\b(?P<nf>)[^.!?\n]*?\b(?:and|not)\s+it\b'''
not_followed_by = '''[\s-]+(?:estate|time|life|world|quick|numbers?|users?|hardware|devices?|data|money)\b'''
category = "filler"
kind = "word"
message = "\"this is the real X, and it ...\" validation formula"
advice = "Say what makes it matter, concretely."
example = "This is the real work, and it never ends."
counterexample = "He is a real estate agent and it shows."

[[phrase]]
id = "performative-honesty"
pattern = '''\bI\s+(?:will\s+not|won't)\s+pretend\b|\b(?:I'll|let's)\s+be\s+(?:honest|blunt|real)\b|\bto\s+be\s+(?:honest|blunt)\b|(?:^|[.!?–—\n])\s*(?P<m>(?:Honestly|Look|Truthfully|Frankly)\s*,)'''
category = "filler"
kind = "phrase"
message = "sincerity announced rather than shown"
advice = "Delete it; the candour should be in the content."
example = "I won't pretend the migration was painless."
counterexample = "Look at the diagram."

[[phrase]]
id = "to-be-clear"
pattern = '''\bto\s+be\s+clear\b'''
category = "filler"
kind = "word"
message = "throat-clearing"
advice = "Delete it and make the statement."
example = "To be clear, the API is unchanged."
counterexample = "The error message needs to be clearer."

[[phrase]]
id = "thats-the-part"
pattern = '''\b(?:that|this|it)(?:'s|\s+(?:is|was))\s+the\s+part\b|\bthe\s+part\s+that\s+(?:makes|made|gets|got|keeps|kept)\s+(?:me|you|us|it)\b|\bmy\s+favou?rite\s+part\s+of\b'''
category = "filler"
kind = "word"
message = "gestures at a detail instead of stating it"
advice = "Say what the part does and why it matters."
example = "That's the part a counter can't reach."
counterexample = "He played the part of the villain."

[[phrase]]
id = "the-only-x-i-trust"
pattern = '''\bthe\s+only\s+[\w-]+(?:\s+[\w-]+){0,2}?\s+(?:I|you|we|it|he|she|they)\s+(?:trust|need|needs|care|want|wants|use|uses|believe)\b|\bthe\s+only\s+[\w-]+\s+that\s+(?:matters|counts|works|survives)\b'''
category = "hype"
kind = "word"
message = "narrowing superlative reveal"
advice = "Make the claim plainly and give the evidence."
example = "The only benchmark that matters is retention."
counterexample = "She was the only engineer on call."

[[phrase]]
id = "take-my-word"
pattern = '''\b(?:you\s+)?(?:do\s+not|don't)\s+(?:have\s+to\s+)?take\s+my\s+word\s+for\s+(?:it|any\s+of\s+(?:it|this|that))\b'''
category = "filler"
kind = "phrase"
message = "stock invitation to verify"
advice = "Link the evidence or the command that reproduces it."
example = "You don't have to take my word for it."
counterexample = "He kept his word."

[[phrase]]
id = "turns-out"
pattern = '''(?:^|[.!?–—\n])\s*(?P<m>Turns\s+out)\b|\bit\s+turns\s+out\s+that\b'''
category = "filler"
kind = "word"
message = "casual-revelation opener"
advice = "State the finding directly."
example = "Turns out the cache was never warm."
counterexample = "She turns out solid work every week."

[[phrase]]
id = "dev-boilerplate"
pattern = '''\b(?:hold|fit|fits|holds|held)\s+(?:it\s+)?in\s+your\s+head\b|\bbatteries[-\s]included\b|\bit\s+just\s+works\b|\bzero[-\s]config(?:uration)?\b|\bsane\s+defaults\b'''
category = "hype"
kind = "word"
message = "dev-blog simplicity boilerplate"
advice = "Say what the user does not have to configure, or how big it is."
example = "Install it and it just works."
counterexample = "We choose boring technology on purpose."

[[phrase]]
id = "heres-the-reveal"
pattern = '''\bhere(?:'s|\s+is)\s+(?:the|a|my|one)\s+(?:problem|first|second|third|next|recent|real|best|worst|surprising|interesting|key|important)\b[\w\s-]{0,20}[:.]'''
category = "opener"
kind = "word"
message = "stage-managed reveal"
advice = "Drop the announcement and give the example or result."
example = "Here's a surprising result: it got faster."
counterexample = "Here's the door code."

[[phrase]]
id = "x-is-dead"
pattern = '''\w\s+(?P<m>(?:is|are)\s+dead)\b|\blong\s+live\s+(?:the\s+)?\w+'''
not_followed_by = '''[\s-]+(?:code|letters?|locks?|ends?|zones?|weight|simple|on\s+arrival)\b'''
category = "hype"
kind = "word"
message = "obituary headline"
advice = "Say what changed and what replaces it."
example = "Peer code review is dead."
counterexample = "This branch is dead code."

[[phrase]]
id = "thats-why-mattered"
pattern = '''\b(?:that|this)(?:'s|\s+(?:is|was))\s+why\b[^.!?\n]{0,80}?\b(?:matter|matters|mattered|counts|counted)\b'''
category = "filler"
kind = "word"
message = "retroactive significance"
advice = "Say the consequence; the reader can see it mattered."
example = "That's why being able to open the environment mattered."
counterexample = "That is why we left early."

[[phrase]]
id = "vague-experts"
pattern = '''\b(?:(?:many|some|several|most|numerous)\s+)?(?:experts|critics|observers|scholars|analysts|commentators)\s+(?:have\s+|often\s+|widely\s+)?(?:argu(?:e|es|ed)|not(?:e|es|ed)|suggest(?:s|ed)?|believ(?:e|es|ed)|agree[ds]?|contend(?:s|ed)?|observ(?:e|es|ed)|caution(?:s|ed)?|claim(?:s|ed)?|cit(?:e|es|ed)|point(?:s|ed)?\s+out)\b|\bindustry\s+reports?\s+(?:suggest|indicate|show)\w*\b'''
category = "hedge"
kind = "phrase"
message = "vague attribution to unnamed authorities"
advice = "Name the source and link it, or make the claim yourself."
example = "Some critics have noted a decline in quality."
counterexample = "Dr. Chen argued the opposite in her paper."

[[phrase]]
id = "despite-challenges"
pattern = '''\bdespite\s+(?:these|those|such|its|their|the|numerous|significant|ongoing)\s+(?:\w+\s+)?challenges\b|\bfac(?:e|es|ed|ing)\s+(?:several|numerous|many|significant|various|a\s+number\s+of)\s+challenges\b|\bchallenges\s+remain\b|\bremains\s+to\s+be\s+seen\b|\b(?:only\s+)?time\s+will\s+tell\b'''
category = "closer"
kind = "phrase"
message = "challenges-and-outlook formula"
advice = "Name the specific open problem and what would resolve it."
example = "Only time will tell whether it sticks."
counterexample = "He arrived on time and will tell you himself."

[[phrase]]
id = "participle-tail"
pattern = ''',\s+(?P<m>(?:highlighting|underscoring|emphasizing|showcasing|solidifying|cementing|underlining)\s+(?:its|his|her|their|our|the|a|an|how|that|what|both))\b'''
category = "filler"
kind = "phrase"
message = "superficial analysis tacked onto the sentence"
advice = "End the sentence at the fact; state any consequence as its own claim with evidence."
example = "Sales doubled, underscoring the strength of the brand."
counterexample = "She kept highlighting passages in yellow."

[[phrase]]
id = "participle-tail-soft"
pattern = ''',\s+(?P<m>(?:reflecting|demonstrating|illustrating|signaling|signalling|reinforcing)\s+(?:its|his|her|their|our|the|a|an|how|that|what|both))\b'''
category = "filler"
kind = "word"
message = "participle tail that may be padding"
advice = "Check the tail adds a fact; otherwise end the sentence before it."
example = "Revenue grew, reflecting the new pricing."
counterexample = "The team, reflecting on the loss, regrouped."

[[phrase]]
id = "promo"
pattern = '''\bin\s+the\s+heart\s+of\b|\bmust-(?:visit|see|try)\b|\brich\s+(?:cultural|historical)\s+(?:heritage|history|tapestry)\b|\bstunning\s+(?:views?|scenery|architecture|backdrop)\b'''
category = "hype"
kind = "phrase"
message = "travel-brochure tone"
advice = "Say it literally."
example = "Located in the heart of downtown."
counterexample = "The soup was rich and hearty."

[[phrase]]
id = "boasts"
pattern = '''\bboasts?\s+(?:a|an|the)\b'''
category = "hype"
kind = "word"
message = "brochure verb"
replace = ["has"]
example = "The library boasts a small API."
counterexample = "The library has a small API."

[[phrase]]
id = "interplay"
match = ["interplay"]
category = "vocabulary"
kind = "word"
