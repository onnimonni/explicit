# explicit's own configuration (dogfooding).

[general]
exclude = ["tests/fixtures/**", "eval/**"]

[rules]
"grammar/OkToOkay" = "off"
"grammar/CompoundNouns" = "off"
"grammar/MassNouns" = "off"

[prose]
accept = [
  "aislop", "terrastruct", "scannerless", "Scannerless", "jison", "retext", "Flesch", "Kincaid",
  "Aho", "Corasick", "cmark", "autofix", "lexically", "Tunables", "unescaped", "Intraword",
  "incl", "Ableist", "wordlists", "heavykenny", "merman", "textlint", "lookaround", "explicitignore", "Prenominal", "elatives", "Andersson", "necessive", "supines", "supine",
  "Voikko", "libvoikko", "subtag", "Damerau", "särskrivning", "msgid", "msgids", "msgstr",
  "msgstrs", "printf", "illative", "illatives", "Telia",
]

[slop]
# `curated` is the name of Harper's dictionary API (`FstDictionary::curated()`).
disable = ["curated"]
